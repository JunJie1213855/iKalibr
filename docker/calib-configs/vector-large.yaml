Configor:
  DataStream:
    IMUTopics:
    - key: /imu/data
      value:
        Type: SENSOR_IMU
        Intrinsics: /opt/ikalibr_ws/src/ikalibr/config/imu-intri.yaml
        AcceWeight: 17.68
        GyroWeight: 57.66
    RadarTopics: []
    LiDARTopics: []
    CameraTopics:
    - key: /camera/left/image_mono
      value:
        Type: SENSOR_IMAGE_GS
        Intrinsics: /configs/intrinsics/vector-large-cam0.yaml
        Weight: 50.0
        TrackLengthMin: 5
        ScaleSplineType: LIN_POS_SPLINE
    - key: /camera/right/image_mono
      value:
        Type: SENSOR_IMAGE_GS
        Intrinsics: /configs/intrinsics/vector-large-cam1.yaml
        Weight: 50.0
        TrackLengthMin: 5
        ScaleSplineType: LIN_POS_SPLINE
    RGBDTopics: []
    ReferIMU: /imu/data
    BagPath: /datasets/VECtor/large_scale_camera_imu_extrinsic_data1.synced.bag
    BeginTime: 1
    Duration: -1
    OutputPath: /results/vector-large
  Prior:
    GravityNorm: 9.8
    SpatTempPrioriPath: ''
    OptTemporalParams: true
    TimeOffsetPadding: 0.1
    ReadoutTimePadding: 0.01
    MapDownSample: 0.05
    KnotTimeDist:
      SO3Spline: 0.05
      ScaleSpline: 0.05
